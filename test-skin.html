<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Skin-Animation Test (isoliert, NICHT Teil des Spiels)</title>
<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/fflate@0.7.4/umd/index.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #1a1d2b; overflow: hidden; font-family: sans-serif; }
  canvas { display: block; }
  #debug {
    position: fixed; top: 10px; left: 10px; z-index: 10;
    background: rgba(0,0,0,0.7); color: #7fffb0; padding: 12px 16px;
    border-radius: 8px; font-size: 13px; white-space: pre-wrap; max-width: 90vw;
  }
  #debug.error { color: #ff8080; }
</style>
</head>
<body>
<div id="debug">Lade SKINANIMIERT.fbx ...</div>
<script>
const debugEl = document.getElementById('debug');
function log(msg, isError) {
  debugEl.textContent += '\n' + msg;
  if (isError) debugEl.classList.add('error');
}

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d2b);
scene.add(new THREE.GridHelper(20, 20, 0x444466, 0x2a2c3d));
scene.add(new THREE.AxesHelper(3));

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 5000);
camera.position.set(6, 4, 9);

scene.add(new THREE.AmbientLight(0xffffff, 1.0));
const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
keyLight.position.set(5, 8, 6);
scene.add(keyLight);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.enableDamping = true;

window.addEventListener('resize', () => {
  renderer.setSize(window.innerWidth, window.innerHeight);
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
});

let mixer = null;
const clock = new THREE.Clock();

new THREE.FBXLoader().load('SKINANIMIERT.fbx', (fbx) => {
  try {
    log('FBX geladen.');
    log('Animationen im Modell: ' + fbx.animations.length);
    fbx.animations.forEach((clip, i) => log('  [' + i + '] "' + clip.name + '" - ' + clip.duration.toFixed(2) + 's, ' + clip.tracks.length + ' Tracks'));

    let meshCount = 0, skinnedCount = 0, boneCount = 0;
    fbx.traverse(obj => {
      if (obj.isMesh) meshCount++;
      if (obj.isSkinnedMesh) {
        skinnedCount++;
        if (obj.skeleton) boneCount = Math.max(boneCount, obj.skeleton.bones.length);
      }
    });
    log('Meshes: ' + meshCount + ' (davon SkinnedMesh: ' + skinnedCount + ')');
    log('Bones im Skelett: ' + boneCount);

    const box = new THREE.Box3().setFromObject(fbx);
    const size = new THREE.Vector3();
    box.getSize(size);
    log('Bounding-Box-Größe (roh, vor Skalierung): x=' + size.x.toFixed(2) + ' y=' + size.y.toFixed(2) + ' z=' + size.z.toFixed(2));

    const maxDim = Math.max(size.x, size.y, size.z) || 1;
    const scale = 3.5 / maxDim;
    fbx.scale.setScalar(scale);
    const center = new THREE.Vector3();
    box.getCenter(center);
    fbx.position.set(-center.x * scale, -box.min.y * scale, -center.z * scale);

    scene.add(fbx);

    if (fbx.animations.length > 0) {
      mixer = new THREE.AnimationMixer(fbx);
      const action = mixer.clipAction(fbx.animations[0]);
      action.setLoop(THREE.LoopRepeat, Infinity);
      action.play();
      log('Spiele Animation [0] in Dauerschleife ab.');
    } else {
      log('KEINE Animationen im Modell gefunden.', true);
    }
  } catch (err) {
    log('FEHLER beim Verarbeiten: ' + err.message, true);
    console.error(err);
  }
}, (xhr) => {
  if (xhr.lengthComputable) {
    debugEl.textContent = 'Lade SKINANIMIERT.fbx ... ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
  }
}, (err) => {
  log('LADEFEHLER: ' + err.message, true);
  console.error(err);
});

(function animate() {
  requestAnimationFrame(animate);
  controls.update();
  if (mixer) mixer.update(clock.getDelta());
  renderer.render(scene, camera);
})();
</script>
</body>
</html>
